name: Scraper Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt pytest

      # All scraper tests: normalization, ACHC program parsing, the
      # hide-listings-ACHC-no-longer-lists step, and the content health
      # checks.
      - name: Run scraper unit tests
        run: pytest scrapers/ -v
